name: sync

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # One branch and one open PR at a time: each run replaces the branch with a fresh sync of main.
      # Commits are authored as the maintainer (noreply address), never as a bot.
      # Merge these PRs with "Rebase and merge" so that authorship is kept.
      # GitHub holds checks on bot-opened PRs for approval, so the citation check runs here
      # and its result goes in the PR description.
      - name: Open or update the sync PR if references changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain skills/swift-evolution/references README.md)" ]; then
            echo "Generated references are already up to date."
            exit 0
          fi
          if node scripts/validate.mjs > validate.log 2>&1 && node scripts/validate.test.mjs >> validate.log 2>&1; then
            result="Citation check passed."
          else
            result="**Citation check failed.** Fix the hand-written files before merging."
          fi
          short=$(grep -o 'swift-evolution commit [0-9a-f]\{7\}' skills/swift-evolution/references/lookup.md | head -1 | cut -d' ' -f3)
          branch=sync/swift-evolution
          title="sync: Swift Evolution $short"
          printf 'Generated by `scripts/sync.mjs`. Check the diff, then merge with **Rebase and merge**.\n\n%s\n\n```\n%s\n```\n' \
            "$result" "$(cat validate.log)" > body.md
          git config user.name zghanw
          git config user.email 117566495+zghanw@users.noreply.github.com
          git switch -C "$branch"
          git add skills/swift-evolution/references README.md
          git commit -m "$title"
          git push --force origin "$branch"
          if [ "$(gh pr view "$branch" --json state -q .state 2>/dev/null)" = "OPEN" ]; then
            gh pr edit "$branch" --title "$title" --body-file body.md
          else
            gh pr create --head "$branch" --title "$title" --body-file body.md
          fi

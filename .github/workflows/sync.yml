name: sync

on:
  schedule:
    - cron: '17 3 * * 1' # Mondays 03:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Commits are authored as the maintainer (noreply address), never as a bot.
      # Merge these PRs with "Rebase and merge" so that authorship is kept.
      - name: Open a PR if references changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain skills/swift-evolution/references README.md)" ]; then
            echo "Generated references are already up to date."
            exit 0
          fi
          short=$(grep -o 'swift-evolution commit [0-9a-f]\{7\}' skills/swift-evolution/references/lookup.md | head -1 | cut -d' ' -f3)
          branch="sync/$short"
          git config user.name zghanw
          git config user.email 117566495+zghanw@users.noreply.github.com
          git switch -c "$branch"
          git add skills/swift-evolution/references README.md
          git commit -m "sync: Swift Evolution $short"
          git push --force origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --head "$branch" --title "sync: Swift Evolution $short" \
              --body "Generated by \`scripts/sync.mjs\`. Check the diff, then merge with **Rebase and merge**."
          fi

name: release-watch

on:
  schedule:
    - cron: '41 6 * * *' # daily 06:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Open an issue when swiftlang/swift publishes a new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest=$(gh release view -R swiftlang/swift --json tagName -q .tagName)
          known=$(grep -o '`swift-[0-9.]*-RELEASE`' skills/swift-evolution/references/lookup.md | head -1 | tr -d '`')
          if [ "$latest" = "$known" ]; then
            echo "Up to date: $latest"
            exit 0
          fi
          title="New Swift release: $latest"
          if [ -n "$(gh issue list --state all --search "\"$title\" in:title" --json number -q '.[].number')" ]; then
            echo "Issue already exists for $latest"
            exit 0
          fi
          gh issue create --title "$title" --body "swiftlang/swift published \`$latest\`; the skill still says \`$known\`. Work through the release-day checklist in AGENTS.md."
